<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090b14"/>
      <stop offset="100%" stop-color="#1e112a"/>
    </linearGradient>

    <!-- Vibrant Cinema & Music Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="35%" stop-color="#ec4899"/>
      <stop offset="70%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Warm Amber Glow -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad)" stroke="url(#neonGrad)" stroke-width="12"/>

  <!-- Film Sprockets Left & Right -->
  <rect x="46" y="140" width="18" height="28" rx="6" fill="#f43f5e" opacity="0.5"/>
  <rect x="46" y="200" width="18" height="28" rx="6" fill="#ec4899" opacity="0.5"/>
  <rect x="46" y="260" width="18" height="28" rx="6" fill="#8b5cf6" opacity="0.5"/>
  <rect x="46" y="320" width="18" height="28" rx="6" fill="#06b6d4" opacity="0.5"/>

  <rect x="448" y="140" width="18" height="28" rx="6" fill="#f43f5e" opacity="0.5"/>
  <rect x="448" y="200" width="18" height="28" rx="6" fill="#ec4899" opacity="0.5"/>
  <rect x="448" y="260" width="18" height="28" rx="6" fill="#8b5cf6" opacity="0.5"/>
  <rect x="448" y="320" width="18" height="28" rx="6" fill="#06b6d4" opacity="0.5"/>

  <!-- Glowing Cinema Clapper & Music Beams -->
  <g filter="url(#glow)">
    <!-- Cinema Clapper Slanted Top -->
    <path d="M120 150 L380 100 L392 144 L132 194 Z" fill="url(#amberGlow)"/>
    <polygon points="170,140 198,135 188,183 160,188" fill="#090b14"/>
    <polygon points="250,125 278,120 268,168 240,173" fill="#090b14"/>
    <polygon points="330,110 358,105 348,153 320,158" fill="#090b14"/>

    <!-- Left Note Head -->
    <ellipse cx="180" cy="350" rx="44" ry="34" transform="rotate(-20 180 350)" fill="url(#neonGrad)"/>
    <circle cx="180" cy="350" r="14" fill="#090b14"/>

    <!-- Right Note Head -->
    <ellipse cx="330" cy="315" rx="44" ry="34" transform="rotate(-20 330 315)" fill="url(#neonGrad)"/>
    <circle cx="330" cy="315" r="14" fill="#090b14"/>

    <!-- Stems -->
    <rect x="210" y="190" width="18" height="160" rx="9" fill="url(#neonGrad)"/>
    <rect x="360" y="155" width="18" height="160" rx="9" fill="url(#neonGrad)"/>

    <!-- Top Beam -->
    <path d="M210 190 L378 155 L378 200 L210 235 Z" fill="url(#neonGrad)"/>

    <!-- Play Symbol in Center -->
    <polygon points="270,252 302,272 270,292" fill="#ffffff"/>
  </g>
</svg>
